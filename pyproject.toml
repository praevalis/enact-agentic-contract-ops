[project]
name = "enact-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]
artifacts = [
    "pdfplumber==0.11.10",
    "pypdf==6.18.1",
    "reportlab==5.0.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/server"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["apps/server/src"]
packages = ["enact"]

[tool.pytest.ini_options]
testpaths = ["apps/server/tests"]
addopts = "--strict-config --strict-markers"
