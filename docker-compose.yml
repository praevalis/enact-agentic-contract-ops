services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ENACT_DATABASE_NAME:-enact}
      POSTGRES_USER: ${POSTGRES_USER:-enact_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-bootstrap-only}
      ENACT_MIGRATE_PASSWORD: ${ENACT_MIGRATE_PASSWORD:-local-migrate-only}
      ENACT_APP_PASSWORD: ${ENACT_DATABASE_PASSWORD:-local-app-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-store:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enact-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-enact-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
    command:
      [
        "alembic",
        "-c",
        "apps/server/alembic.ini",
        "upgrade",
        "head",
      ]
    environment:
      ENACT_ENVIRONMENT: ${ENACT_ENVIRONMENT:-development}
      ENACT_DATABASE_HOST: postgres
      ENACT_DATABASE_USERNAME: enact_migrate
      ENACT_DATABASE_PASSWORD: ${ENACT_MIGRATE_PASSWORD:-local-migrate-only}
      ENACT_DATABASE_PORT: 5432
      ENACT_DATABASE_NAME: ${ENACT_DATABASE_NAME:-enact}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
    environment:
      ENACT_ENVIRONMENT: ${ENACT_ENVIRONMENT:-development}
      ENACT_LOG_LEVEL: ${ENACT_LOG_LEVEL:-INFO}
      ENACT_DATABASE_HOST: postgres
      ENACT_DATABASE_USERNAME: enact_app
      ENACT_DATABASE_PASSWORD: ${ENACT_DATABASE_PASSWORD:-local-app-only}
      ENACT_DATABASE_PORT: 5432
      ENACT_DATABASE_NAME: ${ENACT_DATABASE_NAME:-enact}
      ENACT_API_URL: ${ENACT_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  object-store-data:
