[project]
name = "enact-server"
version = "0.1.0"
description = "Enact application server"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore==3.9.1",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "email-validator>=2.3.0",
    "fastapi==0.141.1",
    "langgraph==1.2.11",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enact"]
